<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Student Service Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">Student Service Tracker</a>
            <button id="logoutButton" class="btn btn-outline-light">Logout</button>
        </div>
    </nav>
    <main class="container py-5" id="dashboardContent" hidden>
        <div class="mb-4">
            <p class="text-primary fw-semibold mb-2">STUDENT SERVICE PORTAL</p>
            <h1 class="fw-bold">Welcome, <span id="welcomeName"></span>!</h1>
            <p class="text-muted">Your account is ready to use.</p>
        </div>
        <div class="row g-3">
            <div class="col-md-4">
                <div class="card dashboard-card h-100">
                    <div class="card-body p-4">
                        <h5>Available Services</h5>
                        <p class="text-muted">Explore university services and their requirements.</p>
                        <a href="services.html" class="btn btn-primary">Browse Services</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card dashboard-card h-100">
                    <div class="card-body p-4">
                        <h5>My Requests</h5>
                        <p class="text-muted">Check the progress of your service requests.</p>
                        <a href="student-requests.html" class="btn btn-primary">View Requests</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card dashboard-card h-100">
                    <div class="card-body p-4">
                        <h5>Account Details</h5>
                        <p class="mb-2"><strong>Name:</strong> <span id="userName"></span></p>
                        <p class="mb-2"><strong>Email:</strong> <span id="userEmail"></span></p>
                        <p class="mb-0"><strong>Role:</strong> <span id="userRole"></span></p>
                    </div>
                </div>
            </div>
        </div>
        <div class="alert alert-primary mt-4"><span id="roleDescription"></span></div>
    </main>
    <script src="js/auth.js"></script>
</body>
</html>
