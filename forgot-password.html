<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Student Service Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Student Service Tracker</a>
            <a href="login.html" class="btn btn-outline-light">Login</a>
        </div>
    </nav>
    <main class="container auth-container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card auth-card shadow border-0">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="text-center fw-bold">Reset Password</h2>
                        <p class="text-center text-muted mb-4">Recover access to your account</p>
                        <div class="alert alert-primary small">Simulation only: no email or SMS is sent. Use the demo OTP 123456.</div>
                        <form id="forgotForm">
                            <div class="mb-3">
                                <label for="resetEmail" class="form-label">Email Address</label>
                                <input type="email" id="resetEmail" class="form-control" placeholder="Enter your registered email" required>
                            </div>
                            <div class="mb-3">
                                <label for="resetOtp" class="form-label">Demo OTP</label>
                                <input type="text" id="resetOtp" class="form-control" placeholder="Enter 123456" inputmode="numeric" maxlength="6" required>
                                <small class="text-muted">Prototype OTP: 123456</small>
                            </div>
                            <div class="mb-3">
                                <label for="newPassword" class="form-label">New Password</label>
                                <input type="password" id="newPassword" class="form-control" placeholder="Enter a new password" minlength="4" required>
                            </div>
                            <div class="mb-3">
                                <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
                                <input type="password" id="confirmNewPassword" class="form-control" placeholder="Enter the new password again" minlength="4" required>
                            </div>
                            <div id="resetMessage" class="mb-3" role="alert"></div>
                            <button type="submit" class="btn btn-primary w-100">Reset Password</button>
                        </form>
                        <p class="text-center mt-4 mb-0">Remember your password? <a href="login.html">Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="js/auth.js"></script>
</body>
</html>
