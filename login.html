<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Student Service Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Student Service Tracker</a>
            <a href="register.html" class="btn btn-outline-light">Register</a>
        </div>
    </nav>
    <main class="container auth-container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card auth-card shadow border-0">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="text-center fw-bold">Welcome Back</h2>
                        <p class="text-center text-muted mb-4">Login to your university service portal</p>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="loginEmail" class="form-label">Email Address</label>
                                <input type="email" id="loginEmail" class="form-control" placeholder="Enter your email" required>
                            </div>
                            <div class="mb-3">
                                <label for="loginPassword" class="form-label">Password</label>
                                <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
                            </div>
                            <div class="text-end mb-3"><a href="forgot-password.html">Forgot Password?</a></div>
                            <div id="loginMessage" class="mb-3" role="alert"></div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>
                        <p class="text-center mt-4 mb-0">Don't have an account? <a href="register.html">Register here</a></p>
                        <hr>
                        <h6 class="text-center">Demo Accounts</h6>
                        <p class="small text-muted text-center mb-0">
                            Student: student@test.com / 1234<br>
                            Staff: staff@test.com / 1234<br>
                            Admin: admin@test.com / 1234
                        </p>
                        <p class="small text-center text-muted mt-3 mb-0">Academic prototype only</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
