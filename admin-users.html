<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users | Student Service Tracker Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body hidden data-page="users">
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="admin-dashboard.html"><span class="brand-mark"></span><span>Student Service Tracker<small>ADMIN PANEL</small></span></a>
    <div class="sidebar-label">Workspace</div>
    <nav class="sidebar-nav">
      <a class="" href="admin-dashboard.html"><span>▦</span> Dashboard</a>
      <a class="active" href="admin-users.html"><span>♙</span> Users</a>
      <a class="" href="admin-services.html"><span>▤</span> Services</a>
      <a class="" href="admin-departments.html"><span>⌂</span> Departments</a>
      <a class="" href="admin-assignments.html"><span>☷</span> Assignments</a>
      <a class="" href="admin-reports.html"><span>▥</span> Reports</a>
    </nav>
    <div class="sidebar-bottom"><div class="sidebar-nav"><a href="#" id="logoutLink"><span>↪</span> Logout</a></div></div>
  </aside>
  <div class="main-area">
    <header class="topbar"><div class="topbar-title">Users</div><div class="admin-chip"><span class="text-secondary d-none d-sm-inline">Administrator</span><span class="avatar" id="adminAvatar">A</span><span class="fw-semibold" id="adminName">Admin</span></div></header>
    <main class="main-content"><div id="toastHolder"></div>
<div class="page-heading"><div><h1>User Management</h1><p>View and manage student and staff accounts.</p></div><button class="btn btn-primary" id="addUserBtn">+ Add User</button></div>
<section class="content-card">
<div class="toolbar"><input id="userSearch" class="form-control" placeholder="Search name, email or department..."><select id="roleFilter" class="form-select"><option value="">All roles</option><option value="student">Student</option><option value="staff">Staff</option><option value="admin">Admin</option></select></div>
<div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Department</th><th>Status</th><th>Actions</th></tr></thead><tbody id="usersTable"></tbody></table></div>
</section>
<div class="modal fade" id="userModal" tabindex="-1"><div class="modal-dialog"><form class="modal-content" id="userForm"><div class="modal-header"><h5 class="modal-title" id="userModalTitle">Add User</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">
<input type="hidden" id="userId"><div class="mb-3"><label class="form-label" for="userName">Full name</label><input required class="form-control" id="userName"></div>
<div class="mb-3"><label class="form-label" for="userEmail">Email</label><input required type="email" class="form-control" id="userEmail"></div>
<div class="mb-3"><label class="form-label" for="userRole">Role</label><select class="form-select" id="userRole"><option value="student">Student</option><option value="staff">Staff</option><option value="admin">Admin</option></select><small class="text-secondary">New users get the password 1234.</small></div>
<div class="mb-3"><label class="form-label" for="userDepartment">Department</label><input required class="form-control" id="userDepartment"></div>
<div class="mb-3"><label class="form-label" for="userStatus">Status</label><select class="form-select" id="userStatus"><option>Active</option><option>Inactive</option></select></div>
</div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit">Save User</button></div></form></div></div>
</main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script><script src="js/ui.js"></script><script src="js/admin.js"></script>
</body></html>
