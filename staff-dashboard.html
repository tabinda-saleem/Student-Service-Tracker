
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard | Student Service Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="staff-dashboard.html">
                Student Service Tracker
            </a>
            <button id="logoutButton" class="btn btn-outline-light">
                Logout
            </button>
        </div>
    </nav>

    <main class="container py-5" id="staffDashboardContent" hidden>
        <p class="text-primary fw-semibold">STAFF SERVICE PORTAL</p>

        <h1 class="fw-bold">
            Welcome, <span id="welcomeName"></span>!
        </h1>

        <p class="text-muted">
            Manage your university service responsibilities.
        </p>

        <div class="row g-3 mt-3">
            <div class="col-md-6">
                <div class="card dashboard-card p-4 h-100">
                    <h5>Available Services</h5>
                    <p>View university services and their details.</p>
                    <a href="services.html" class="btn btn-primary">
                        Browse Services
                    </a>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card dashboard-card p-4 h-100">
                    <h5>Staff Account</h5>
                    <p><strong>Name:</strong> <span id="userName"></span></p>
                    <p><strong>Email:</strong> <span id="userEmail"></span></p>
                    <p><strong>Role:</strong> Staff</p>
                </div>
            </div>
        </div>

        <div class="alert alert-primary mt-4">
            You are successfully logged in to the Staff Portal.
        </div>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
