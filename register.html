<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Student Service Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Student Service Tracker</a>
            <a href="login.html" class="btn btn-outline-light">Login</a>
        </div>
    </nav>
    <main class="container auth-container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card auth-card shadow border-0">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="text-center fw-bold">Create Account</h2>
                        <p class="text-center text-muted mb-4">Register for the Student Service Tracker</p>
                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="registerName" class="form-label">Full Name</label>
                                <input type="text" id="registerName" class="form-control" placeholder="Enter your full name" required>
                            </div>
                            <div class="mb-3">
                                <label for="registerEmail" class="form-label">Email Address</label>
                                <input type="email" id="registerEmail" class="form-control" placeholder="Enter your email" required>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="registerStudentId" class="form-label">Student ID</label>
                                    <input type="text" id="registerStudentId" class="form-control" placeholder="e.g. 24CS111" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="registerPhone" class="form-label">Phone</label>
                                    <input type="tel" id="registerPhone" class="form-control" placeholder="Enter your phone number" required>
                                </div>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-8">
                                    <label for="registerDepartment" class="form-label">Department</label>
                                    <select id="registerDepartment" class="form-select" required>
                                        <option value="">Choose your department</option>
                                        <option>Computer System Engineering</option>
                                        <option>Electrical Engineering</option>
                                        <option>Mechanical Engineering</option>
                                        <option>Other</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="registerSemester" class="form-label">Semester</label>
                                    <select id="registerSemester" class="form-select" required>
                                        <option value="">Select</option>
                                        <option>1</option><option>2</option><option>3</option><option>4</option>
                                        <option>5</option><option>6</option><option>7</option><option>8</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="registerPassword" class="form-label">Password</label>
                                <input type="password" id="registerPassword" class="form-control" placeholder="Create a password" minlength="4" required>
                                <small class="text-muted">Use at least 4 characters for this demo.</small>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirm Password</label>
                                <input type="password" id="confirmPassword" class="form-control" placeholder="Enter the password again" minlength="4" required>
                            </div>
                            <div id="registerMessage" class="mb-3" role="alert"></div>
                            <button type="submit" class="btn btn-primary w-100">Create Account</button>
                        </form>
                        <p class="text-center mt-4 mb-0">Already registered? <a href="login.html">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="js/auth.js"></script>
</body>
</html>
