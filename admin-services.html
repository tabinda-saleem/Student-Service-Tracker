<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services | Student Service Tracker Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body hidden data-page="services">
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="admin-dashboard.html"><span class="brand-mark"></span><span>Student Service Tracker<small>ADMIN PANEL</small></span></a>
    <div class="sidebar-label">Workspace</div>
    <nav class="sidebar-nav">
      <a class="" href="admin-dashboard.html"><span>▦</span> Dashboard</a>
      <a class="" href="admin-users.html"><span>♙</span> Users</a>
      <a class="active" href="admin-services.html"><span>▤</span> Services</a>
      <a class="" href="admin-departments.html"><span>⌂</span> Departments</a>
      <a class="" href="admin-assignments.html"><span>☷</span> Assignments</a>
      <a class="" href="admin-reports.html"><span>▥</span> Reports</a>
    </nav>
    <div class="sidebar-bottom"><div class="sidebar-nav"><a href="#" id="logoutLink"><span>↪</span> Logout</a></div></div>
  </aside>
  <div class="main-area">
    <header class="topbar"><div class="topbar-title">Services</div><div class="admin-chip"><span class="text-secondary d-none d-sm-inline">Administrator</span><span class="avatar" id="adminAvatar">A</span><span class="fw-semibold" id="adminName">Admin</span></div></header>
    <main class="main-content"><div id="toastHolder"></div>
<div class="page-heading"><div><h1>Service Management</h1><p>Create and maintain university services.</p></div><button class="btn btn-primary" id="addServiceBtn">+ Add Service</button></div>
<section class="content-card"><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Service</th><th>Department</th><th>Processing Time</th><th>Required Documents</th><th>Actions</th></tr></thead><tbody id="servicesTable"></tbody></table></div></section>
<div class="modal fade" id="serviceModal" tabindex="-1"><div class="modal-dialog"><form class="modal-content" id="serviceForm"><div class="modal-header"><h5 class="modal-title" id="serviceModalTitle">Add Service</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">
<input type="hidden" id="serviceId"><div class="mb-3"><label class="form-label" for="serviceName">Service name</label><input required class="form-control" id="serviceName"></div>
<div class="mb-3"><label class="form-label" for="serviceDepartment">Department</label><input required class="form-control" id="serviceDepartment"></div>
<div class="mb-3"><label class="form-label" for="serviceDescription">Description</label><textarea class="form-control" id="serviceDescription" rows="2"></textarea></div>
<div class="mb-3"><label class="form-label" for="serviceTime">Processing time</label><input required class="form-control" id="serviceTime" placeholder="3-5 Days"></div>
<div class="mb-3"><label class="form-label" for="serviceDocs">Required documents</label><input class="form-control" id="serviceDocs" placeholder="Student ID, application form"></div>
</div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit">Save Service</button></div></form></div></div>
</main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script><script src="js/ui.js"></script><script src="js/admin.js"></script>
</body></html>
